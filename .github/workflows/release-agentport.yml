name: Build AgentPort release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build signed-by-hash executable
        shell: pwsh
        run: |
          go -C src build -trimpath -ldflags '-s -w -H=windowsgui' -o ../AgentPort.exe .
          $hash = (Get-FileHash AgentPort.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgentPort.exe" | Set-Content -NoNewline -Encoding ascii AgentPort.exe.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME AgentPort.exe AgentPort.exe.sha256 --repo $env:GITHUB_REPOSITORY --generate-notes
