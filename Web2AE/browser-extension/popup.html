<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web2AE</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Web2AE</h1>
        <p>Live Web → After Effects</p>
      </div>
      <span class="badge">v1.0.0</span>
    </header>

    <section class="statusCard">
      <div class="statusRow"><span id="dot" class="dot"></span><strong id="bridgeStatus">Checking After Effects…</strong></div>
      <div id="pageTitle" class="pageTitle">Current tab</div>
      <div id="pageUrl" class="pageUrl"></div>
    </section>

    <button id="send" class="primary" disabled>Send Current Page to AE</button>

    <section id="companionHelp" class="setupCard" hidden>
      <strong>After Effects companion required</strong>
      <p>Install the free Web2AE companion once, then open <b>Window → Extensions → Web2AE</b> in After Effects.</p>
      <button id="openSetup" class="secondary">Open setup guide</button>
    </section>

    <section id="progressWrap" class="progressWrap" hidden>
      <div class="progressHead"><span id="progressLabel">Preparing capture…</span><span id="progressPct">0%</span></div>
      <div class="track"><div id="bar" class="bar"></div></div>
      <div id="detail" class="detail"></div>
    </section>

    <div id="message" class="message" aria-live="polite"></div>
    <footer>Created by Elliot Mckenzie / zura</footer>
  </main>
<script src="popup.js"></script>
</body>
</html>
