name: Build and release AgentPort v1.6.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.6.1.yml'
      - '.release-build/v1.6/main_v161.go'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Reconstruct and validate AgentPort v1.6.1 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = '.release-build/v1.6'
          $build = Join-Path $env:RUNNER_TEMP 'agentport-v1.6.1-build'
          New-Item -ItemType Directory -Force -Path $build | Out-Null

          $parts = for ($i = 0; $i -le 9; $i++) {
            $path = Join-Path $payload ('part_{0:D2}.txt' -f $i)
            if (-not (Test-Path $path)) { throw "Missing source chunk: $path" }
            [regex]::Replace((Get-Content $path -Raw), '\s', '')
          }

          $sourceB64 = $parts -join ''
          $xz = Join-Path $build 'source.xz'
          [IO.File]::WriteAllBytes($xz, [Convert]::FromBase64String($sourceB64))
          $xzSha = (Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xzSha -ne '761a3a790a1ab2933fb79f8e5d7a9298c9c2c1322050421ba44ca40d42d69178') {
            throw "Source archive checksum mismatch: $xzSha"
          }

          $basePs1 = Join-Path $build 'AgentPort_v1.6.0-base.ps1'
          python -c "import lzma,pathlib; p=pathlib.Path(r'$xz'); pathlib.Path(r'$basePs1').write_bytes(lzma.decompress(p.read_bytes()))"
          $baseSha = (Get-FileHash $basePs1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baseSha -ne '1ae97d927d7a4724538e9cfe837d3306ed6e70a8c6dce6bedcecead0539991c3') {
            throw "Reconstructed base source checksum mismatch: $baseSha"
          }

          $text = [IO.File]::ReadAllText($basePs1)
          $text = $text.Replace('$script:AppVersion = ''1.6.0''', '$script:AppVersion = ''1.6.1''')
          $ps1 = Join-Path $build 'AgentPort_v1.6.1.ps1'
          [IO.File]::WriteAllText($ps1, $text, [Text.UTF8Encoding]::new($false))

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($ps1, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $messages = ($parseErrors | ForEach-Object { "Line $($_.Extent.StartLineNumber): $($_.Message)" }) -join "`n"
            throw "PowerShell parse validation failed:`n$messages"
          }

          Copy-Item (Join-Path $payload 'main_v161.go') (Join-Path $build 'main.go')
          $resourceB64 = [regex]::Replace((Get-Content (Join-Path $payload 'rsrc_amd64.syso.b64') -Raw), '\s', '')
          $resource = Join-Path $build 'rsrc_amd64.syso'
          [IO.File]::WriteAllBytes($resource, [Convert]::FromBase64String($resourceB64))
          $resourceSha = (Get-FileHash $resource -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($resourceSha -ne 'b9ef161be858a723e37e087e4c3e32f9408fb1db755873daf1126e39723bad69') {
            throw "Icon resource checksum mismatch: $resourceSha"
          }

          "BUILD_DIR=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_PS1=$ps1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test PowerShell UI startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $env:RUNNER_TEMP 'agentport-ps1-smoke.out.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'agentport-ps1-smoke.err.log'
          $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $quoted = '"' + $env:APP_PS1 + '"'
          $p = Start-Process -FilePath $powershell -ArgumentList @('-NoLogo','-NoProfile','-STA','-ExecutionPolicy','Bypass','-File',$quoted) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
            $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            throw "AgentPort PowerShell UI exited during startup. Exit $($p.ExitCode).`nSTDOUT:`n$out`nSTDERR:`n$err"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'PowerShell UI remained alive for the startup smoke-test window.'

      - name: Build Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:BUILD_DIR
          go mod init github.com/ZURAVFX/AgentPort/release-build-v161
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o AgentPort_v1.6.1.exe .
          Pop-Location
          $exe = Get-Item (Join-Path $env:BUILD_DIR 'AgentPort_v1.6.1.exe')
          if ($exe.Length -lt 500000) { throw "Built EXE is unexpectedly small: $($exe.Length) bytes" }

      - name: Smoke test packaged EXE startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:BUILD_DIR 'AgentPort_v1.6.1.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            $log = Join-Path $env:LOCALAPPDATA 'AgentPort\launcher-v1.6.1.log'
            $details = if (Test-Path $log) { Get-Content $log -Raw } else { 'No launcher log was created.' }
            throw "Packaged AgentPort EXE exited during startup. Exit $($p.ExitCode).`n$details"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*AgentPort-runtime-v1.6.1.ps1*' } | ForEach-Object { Invoke-CimMethod -InputObject $_ -MethodName Terminate | Out-Null }
          Write-Host 'Packaged EXE remained alive for the startup smoke-test window.'

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Copy-Item (Join-Path $env:BUILD_DIR 'AgentPort_v1.6.1.exe') 'releases/AgentPort_v1.6.1.exe' -Force
          $sha = (Get-FileHash 'releases/AgentPort_v1.6.1.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $sha | Set-Content 'releases/AgentPort_v1.6.1.sha256' -Encoding ascii
          Write-Host "AgentPort_v1.6.1.exe SHA256 $sha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentPort-v1.6.1
          path: |
            releases/AgentPort_v1.6.1.exe
            releases/AgentPort_v1.6.1.sha256

      - name: Commit hotfix build to repository
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f releases/AgentPort_v1.6.1.exe releases/AgentPort_v1.6.1.sha256
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Release AgentPort v1.6.1 startup hotfix'
            git push origin HEAD:main
          }

      - name: Publish GitHub Release v1.6.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          AgentPort v1.6.1 is a startup hotfix for the v1.6.0 release.

          Fixes:
          - fixes the standalone EXE appearing to do nothing on startup
          - forces the embedded WPF runtime to Windows PowerShell STA mode
          - adds a persistent launcher log under %LOCALAPPDATA%\AgentPort
          - shows a visible startup error instead of silently swallowing PowerShell failures
          - validates the PowerShell source before packaging
          - smoke-tests both the PowerShell UI and final packaged EXE on a Windows GitHub runner before release

          The .sha256 file is optional and is only provided for download verification.
          '@
          $notes | Set-Content release-notes-v1.6.1.md -Encoding utf8

          gh release view v1.6.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.6.1 releases/AgentPort_v1.6.1.exe releases/AgentPort_v1.6.1.sha256 --clobber
          } else {
            gh release create v1.6.1 releases/AgentPort_v1.6.1.exe releases/AgentPort_v1.6.1.sha256 --target main --title 'AgentPort v1.6.1' --notes-file release-notes-v1.6.1.md --latest
          }

          gh release edit v1.6.0 --prerelease --title 'AgentPort v1.6.0 - superseded' --notes 'Superseded by v1.6.1 because the v1.6.0 launcher could fail silently during startup. Please download v1.6.1 instead.'
