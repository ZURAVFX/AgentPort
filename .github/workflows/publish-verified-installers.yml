name: Publish verified AgentPort installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release-notes/v3.1.23-delivery.json]

permissions:
  contents: write

concurrency:
  group: publish-agentport-3.1.23
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - name: Verify approved installer downloads and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, mkdirSync, writeFileSync, createWriteStream } from 'node:fs';
          import { once } from 'node:events';
          import { finished } from 'node:stream/promises';
          const repo = 'ZURAVFX/AgentPort';
          const version = '3.1.23';
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          const manifest = JSON.parse(readFileSync(`release-notes/v${version}-delivery.json`, 'utf8'));
          assert.equal(manifest.version, version);
          assert.match(manifest.sourceSha, /^[0-9a-f]{40}$/);
          const allowed = new Set([
            `agentport-${version}-windows-x64.exe`,
            `agentport-${version}-macos-arm64.dmg`,
            `agentport-${version}-macos-arm64.zip`,
          ]);
          assert.equal(manifest.assets.length, allowed.size);
          mkdirSync('verified-installers', { recursive: true });
          for (const asset of manifest.assets) {
            assert.ok(allowed.delete(asset.name), 'Unexpected or repeated release asset.');
            assert.match(asset.sha256, /^[a-f0-9]{64}$/);
            assert.ok(Number.isSafeInteger(asset.size) && asset.size > 1048576 && asset.size < 1073741824);
            const url = new URL(asset.url);
            assert.equal(url.protocol, 'https:');
            assert.equal(url.hostname, 'release-assets.githubusercontent.com');
            assert.equal(url.username + url.password, '');
            const response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(240000) });
            assert.equal(response.status, 200, `Installer download failed: ${asset.name}`);
            const output = createWriteStream(`verified-installers/${asset.name}`, { flags: 'wx' });
            const completion = finished(output);
            const hash = createHash('sha256');
            let received = 0;
            try {
              for await (const chunk of response.body) {
                received += chunk.length;
                assert.ok(received <= asset.size, 'Installer exceeds its verified size.');
                hash.update(chunk);
                if (!output.write(chunk)) await once(output, 'drain');
              }
              output.end();
              await completion;
            } catch (error) {
              output.destroy();
              await completion.catch(() => {});
              throw error;
            }
            assert.equal(received, asset.size);
            assert.equal(hash.digest('hex'), asset.sha256, `Installer checksum mismatch: ${asset.name}`);
            console.log(`Verified ${asset.name}: ${asset.size} bytes, SHA-256 ${asset.sha256}`);
          }
          assert.equal(allowed.size, 0);
          const sums = manifest.assets.map(asset => `${asset.sha256}  ${asset.name}`).join('\n') + '\n';
          writeFileSync('verified-installers/SHA256SUMS.txt', sums);
          const publishAssets = [...manifest.assets, {
            name: 'SHA256SUMS.txt', size: Buffer.byteLength(sums),
            sha256: createHash('sha256').update(sums).digest('hex'),
          }];
          const base = `https://api.github.com/repos/${repo}/releases`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          let response = await fetch(`${base}/tags/v${version}`, { headers, redirect: 'error' });
          let release;
          if (response.status === 404) {
            response = await fetch(base, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, redirect: 'error', body: JSON.stringify({
              tag_name: `v${version}`, target_commitish: process.env.GITHUB_SHA,
              name: `AgentPort ${version} - Codex Accounts`, draft: true, prerelease: false,
              body: readFileSync(`release-notes/v${version}.md`, 'utf8'),
            }) });
            assert.equal(response.status, 201, 'Could not create release staging.');
            release = await response.json();
          } else {
            assert.equal(response.status, 200);
            release = await response.json();
          }
          assert.equal(release.tag_name, `v${version}`);
          for (const asset of publishAssets) {
            const existing = release.assets.find(entry => entry.name === asset.name);
            if (existing) {
              assert.equal(existing.size, asset.size);
              assert.equal(existing.digest, `sha256:${asset.sha256}`, 'Refuse to replace a different existing release asset.');
              continue;
            }
            assert.equal(release.draft, true, 'Refuse to change assets on an already published release.');
            const url = new URL(release.upload_url.replace(/\{.*$/, ''));
            assert.equal(url.origin, 'https://uploads.github.com');
            assert.equal(url.pathname, `/repos/${repo}/releases/${release.id}/assets`);
            url.searchParams.set('name', asset.name);
            const upload = await fetch(url, { method: 'POST', headers: { ...headers, 'Content-Type': 'application/octet-stream' },
              body: readFileSync(`verified-installers/${asset.name}`), redirect: 'error', signal: AbortSignal.timeout(240000) });
            assert.equal(upload.status, 201, `Upload failed: ${asset.name}`);
            const saved = await upload.json();
            assert.equal(saved.size, asset.size);
            assert.equal(saved.digest, `sha256:${asset.sha256}`);
            console.log(`Uploaded and verified ${asset.name}`);
          }
          response = await fetch(`${base}/${release.id}`, { headers, redirect: 'error' });
          assert.equal(response.status, 200);
          const checked = await response.json();
          assert.equal(checked.assets.length, publishAssets.length, 'Unexpected files must not be published.');
          for (const asset of publishAssets) {
            const saved = checked.assets.find(entry => entry.name === asset.name);
            assert.equal(saved?.state, 'uploaded');
            assert.equal(saved.size, asset.size);
            assert.equal(saved.digest, `sha256:${asset.sha256}`);
          }
          if (checked.draft) {
            response = await fetch(`${base}/${release.id}`, { method: 'PATCH', headers: { ...headers, 'Content-Type': 'application/json' }, redirect: 'error',
              body: JSON.stringify({ draft: false, prerelease: false, make_latest: 'true' }) });
            assert.equal(response.status, 200, 'Could not publish the checked release.');
          }
          console.log(`Published https://github.com/${repo}/releases/tag/v${version}`);
          NODE
