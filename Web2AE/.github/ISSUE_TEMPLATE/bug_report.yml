name: Bug report
description: Report a webpage/capture issue
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please avoid sharing private page contents unless you are comfortable making them public."
  - type: input
    id: browser
    attributes:
      label: Browser + version
    validations: {required: true}
  - type: input
    id: ae
    attributes:
      label: After Effects version
    validations: {required: true}
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations: {required: true}
  - type: textarea
    id: log
    attributes:
      label: Web2AE Activity log
      render: shell
